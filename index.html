<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CyberSentinel</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
</head>

<body>

  <header class="topbar">
    <div class="brand">CYBERSENTINEL</div>

    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>
  </header>


  <main class="dashboard">

    <aside class="panel events-panel">

      <div class="panel-header">
        <h2>LIVE EVENTS</h2>
      </div>

      <div class="panel-content" id="events-list"></div>

    </aside>


    <section class="panel map-panel">

      <div class="panel-header">
        <h2>WORLD ACTIVITY</h2>
      </div>

      <div id="map">

      </div>

    </section>


  </main>


  <footer class="footer">
    <span>CYBERSENTINEL</span>
    <span>THREAT INTELLIGENCE INTERFACE</span>
  </footer>


  <script src="js/app.js" type="module"></script>
  <!-- <script type="module" ></script> -->

</body>

</html>
