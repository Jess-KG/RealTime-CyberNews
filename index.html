<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CyberSentinel</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
</head>

<body>

  <header class="topbar">
    <div class="brand">CYBERSENTINEL</div>

    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>
  </header>


  <main class="dashboard">

    <aside class="panel events-panel">

      <div class="panel-header">
        <h2>LIVE EVENTS</h2>
      </div>

      <div class="panel-content" id="events-list"></div>

    </aside>


    <section class="panel map-panel">

      <div class="panel-header">
        <h2>WORLD ACTIVITY</h2>
      </div>

      <div id="map">

      </div>

    </section>


  </main>


  <footer class="footer">
    <span>CYBERSENTINEL</span>
    <span>THREAT INTELLIGENCE INTERFACE</span>
  </footer>


  <script src="js/app.js"></script>
  <script type="module">
    console.log("loaded the library")

    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
      container: 'map', // container id
      style: 'https://demotiles.maplibre.org/style.json', // style URL
      center: [0, 0], // starting position [lng, lat]
      zoom: 1, // starting zoom
      maplibreLogo: true
    });

    map.on('load', () => {
      map.setPaintProperty(
        "background",
        'background-color',
        '#03060A'
      );
      map.setPaintProperty(
        'coastline',
        'line-color',
        '#164A5A'
      );
      map.setPaintProperty(
        'countries-fill',
        'fill-color',
        '#111C26'
      );
      map.setPaintProperty(
        'countries-boundary',
        'line-color',
        '#00E5FF'
      );

      map.setLayoutProperty(
        'geolines',
        'visibility',
        'none'
      );

      map.setLayoutProperty(
        'geolines-label',
        'visibility',
        'none'
      );
    })

    const eventsList = document.getElementById("events-list");

    // Target country
    const incidents = [
      {
        id: 1,
        country: 'Australia',
        coordinates: [133.7751, -25.2744],
        threat: 'RANSOMWARE',
        severity: 'HIGH',
        sector: 'Healthcare',
        status: 'ACTIVE',
        source: 'CISA'
      },

      {
        id: 2,
        country: 'Japan',
        coordinates: [138.2529, 36.2048],
        threat: 'PHISHING',
        severity: 'LOW',
        sector: 'Finance',
        status: 'ACTIVE',
        source: 'CISA'
      },
      {
        id: 3,
        country: 'Germany',
        coordinates: [10.4515, 51.1657],
        threat: 'MALWARE',
        severity: 'CRITICAL',
        sector: 'Manufacturing',
        status: 'ACTIVE',
        source: 'TEST'
      },

      {
        id: 4,
        country: 'United States',
        coordinates: [-100.0, 38.0],
        threat: 'PHISHING',
        severity: 'HIGH',
        sector: 'Finance',
        status: 'ACTIVE',
        source: 'TEST'
      },

      {
        id: 5,
        country: 'United Kingdom',
        coordinates: [-3.4360, 55.3781],
        threat: 'DATA BREACH',
        severity: 'HIGH',
        sector: 'Healthcare',
        status: 'INVESTIGATING',
        source: 'TEST'
      },

      {
        id: 6,
        country: 'Brazil',
        coordinates: [-51.9253, -14.2350],
        threat: 'RANSOMWARE',
        severity: 'CRITICAL',
        sector: 'Government',
        status: 'ACTIVE',
        source: 'TEST'
      },

      {
        id: 7,
        country: 'Singapore',
        coordinates: [103.8198, 1.3521],
        threat: 'CREDENTIAL THEFT',
        severity: 'MEDIUM',
        sector: 'Technology',
        status: 'INVESTIGATING',
        source: 'TEST'
      },

      {
        id: 8,
        country: 'India',
        coordinates: [78.9629, 20.5937],
        threat: 'DDoS',
        severity: 'LOW',
        sector: 'Telecommunications',
        status: 'RESOLVED',
        source: 'TEST'
      }
    ];

    const severities = {
      'CRITICAL': '#FF3B5C', // red
      'HIGH': '#FF8A3D',     // orange
      'MEDIUM': '#FFC857',   // yellow
      'LOW': '#35E68A'       // green
    };

    incidents.forEach(target => {
      const el = document.createElement('div');
      el.className = 'cyber-marker';
      el.style.background = severities[target.severity];
      el.style.boxShadow = `0 0 8px ${severities[target.severity]}`;

      // Create popup
      const popup = new maplibregl.Popup({
        offset: 25,
        closeButton: true,
        closeOnClick: true
      }).setHTML(`
              <div class="threat-popup">
                <div class="popup-header">
                  <span class="popup-status"></span>
                  THREAT DETECTED
                </div>

                <div class="popup-country">
                  ${target.country}
                </div>

                <div class="popup-grid">
                  <div>
                    <span>TYPE</span>
                    <strong>${target.threat}</strong>
                  </div>

                  <div>
                    <span>SEVERITY</span>
                    <strong>${target.severity}</strong>
                  </div>

                  <div>
                    <span>SECTOR</span>
                    <strong>${target.sector}</strong>
                  </div>

                  <div>
                    <span>STATUS</span>
                    <strong>${target.status}</strong>
                  </div>

                  <div>
                    <span>SOURCE</span>
                    <strong>${target.source}</strong>
                  </div>
                </div>
              </div>
              `);

      // Add marker
      new maplibregl.Marker({ element: el })
        .setLngLat(target.coordinates)
        .setPopup(popup)
        .addTo(map);


      const eventCard = document.createElement('div');
      eventCard.className = 'event-card';
      eventCard.dataset.id = target.id;

      eventCard.innerHTML = `

              <div class="event-card-header">
                <span class="event-country">${target.country}</span>
                <span class="event-severity" style="color:${severities[target.severity]}">${target.severity}</span>
              </div>

              <div class="event-threat">
                ${target.threat}
              </div>

              <div class="event-details">
                <div>
                  <span>SECTOR</span>
                  <strong>${target.sector}</strong>
                </div>

                <div>
                  <span>STATUS</span>
                  <strong>${target.status}</strong>
                </div>

                <div>
                  <span>SOURCE</span>
                  <strong>${target.source}</strong>
                </div>
              </div>`

      eventCard.addEventListener('click', () => {
        const id = eventCard.dataset.id;
        const incident = incidents.find(target => target.id == id);
        console.log(incident.id);
        map.flyTo({
          center: incident.coordinates
        });
      })
      eventsList.appendChild(eventCard);
    })
    // Create marker element

  </script>

</body>

</html>
